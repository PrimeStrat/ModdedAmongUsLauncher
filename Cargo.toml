[package]
name = "modded_among_us"
version = "2.0.0"
edition = "2021"
license = "GPL-3.0"

[[bin]]
name = "ModdedMongyLauncher"
path = "src/main.rs"

[[test]]
name = "self_test"
path = "TestTools/self_test.rs"

[dependencies]
eframe = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
winreg = "0.52"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = "s"
lto = true
strip = true

[build-dependencies]
winresource = "0.1.34"
